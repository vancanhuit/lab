storage: /var/lib/lego

log:
  level: info
  format: json

accounts:
  letsencrypt:
    server: https://acme-v02.api.letsencrypt.org/directory
    keyType: EC256
    acceptsTermsOfService: true

challenges:
  cloudflare:
    dns:
      provider: cloudflare
      envFile: /etc/lego/cloudflare.env
      resolvers:
        - 1.1.1.1:53
        - 1.0.0.1:53
      dnsTimeout: 30

certificates:
  dns:
    account: letsencrypt
    challenge: cloudflare
    keyType: EC256
    domains:
      - dns.lab.canhdinh.com
