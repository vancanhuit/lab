[settings]
lockfile = true
pipx.uvx = true

[tools]
age = "1.3.1"
cocogitto = "7.0.0"
gitleaks = "8.30.1"
trufflehog = "3.96.0"
sops = "3.13.3"
python = "3.14.7"
uv = { version = "0.12.2", depends = ["python"] }
"pipx:ansible" = { version = "14.2.0", uvx_args = "--with-executables-from ansible-core --with-executables-from ansible-lint", depends = [
  "uv",
] }
gh = "2.97.0"

[tasks."ansible:deps"]
description = "Install Ansible Galaxy collections from requirements.yml"
dir = "ansible"
run = "ansible-galaxy collection install -r requirements.yaml"

[tasks."hooks:install"]
description = "Install repository Git hooks"
run = "cog install-hook --all --overwrite"

[tasks."secrets:edit"]
description = "Edit the sops-encrypted secrets file"
dir = "ansible"
run = "sops group_vars/all/secrets.sops.yaml"

[tasks."secrets:view"]
description = "Decrypt and print the sops-encrypted secrets file"
dir = "ansible"
run = "sops --decrypt group_vars/all/secrets.sops.yaml"

[tasks."security:secrets"]
description = "Scan Git history for leaked secrets"
run = '''
#!/usr/bin/env bash
set -euo pipefail

gitleaks git --redact --no-banner --log-opts='--all --full-history'
trufflehog git file://. \
  --results=verified,unknown \
  --fail \
  --fail-on-scan-errors \
  --no-update \
  --json | \
  python scripts/sanitize_trufflehog_output.py
'''
