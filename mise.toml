[settings]
lockfile = true
pipx.uvx = true

[tools]
age = "1.3.1"
cocogitto = "7.0.0"
gitleaks = "8.30.1"
trufflehog = "3.96.0"
sops = "3.13.3"
python = "3.14.7"
uv = { version = "0.12.3", depends = ["python"] }
"pipx:ansible" = { version = "14.3.0", uvx_args = "--with-executables-from ansible-core --with-executables-from ansible-lint", depends = ["uv"] }
gh = "2.97.0"

[tasks."ansible:deps"]
description = "Install Ansible Galaxy collections from requirements.yml"
dir = "ansible"
run = "ansible-galaxy collection install -r requirements.yaml"

[tasks."hooks:install"]
description = "Install repository Git hooks"
run = "cog install-hook --all --overwrite"

[tasks."secrets:edit"]
description = "Edit one sops-encrypted secrets file selected by SOPS_FILE"
dir = "ansible"
run = 'sops "${SOPS_FILE:?set SOPS_FILE to a path relative to ansible/}"'

[tasks."secrets:view"]
description = "Decrypt one secrets file selected by SOPS_FILE"
dir = "ansible"
run = 'sops --decrypt "${SOPS_FILE:?set SOPS_FILE to a path relative to ansible/}"'

[tasks."secrets:check"]
description = "Authenticate every sops-encrypted inventory file"
dir = "ansible"
run = '''
#!/usr/bin/env bash
set -euo pipefail

while IFS= read -r -d '' secret_file; do
  sops --decrypt "$secret_file" >/dev/null
done < <(find group_vars host_vars -type f -name '*.sops.yaml' -print0 | sort -z)
'''

[tasks."security:secrets"]
description = "Scan Git history for leaked secrets"
run = '''
#!/usr/bin/env bash
set -euo pipefail

gitleaks git --redact --no-banner --log-opts='--all --full-history'
trufflehog git file://. \
  --results=verified,unknown \
  --fail \
  --fail-on-scan-errors \
  --no-update \
  --json | \
  python scripts/sanitize_trufflehog_output.py
'''
