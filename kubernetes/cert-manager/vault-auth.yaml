apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: cert-manager
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cert-manager-vault-tokenreviewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vault-tokenreviewer
subjects:
  - kind: ServiceAccount
    name: vault-auth
    namespace: cert-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-secrets-vault-auth
  namespace: cert-manager
rules:
  - apiGroups: ['']
    resources: [serviceaccounts/token]
    resourceNames: [vault-auth]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-secrets-vault-auth
  namespace: cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: external-secrets-vault-auth
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
