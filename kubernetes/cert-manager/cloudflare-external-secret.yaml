apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  refreshPolicy: Periodic
  refreshInterval: 1m
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: cloudflare-api-token
    # Keep the DNS credential if this ExternalSecret is removed during recovery.
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
    - secretKey: api-token
      remoteRef:
        key: kubernetes/cert-manager/cloudflare-api-token
        property: api-token
