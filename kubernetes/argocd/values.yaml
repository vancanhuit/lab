global:
  domain: argocd.lab.canhdinh.com
  image:
    # Chart 10.10.5 still defaults to v3.5.5; match the pinned CLI patch release.
    tag: v3.5.6

configs:
  cm:
    # Gitea grants broad API access without the additional public-only scope.
    oidc.config: |
      name: Gitea
      issuer: https://gitea.lab.canhdinh.com
      clientID: d4d791ed-a781-4bc4-91de-855cf943e4fb
      clientSecret: $argocd-gitea-oidc:client-secret
      cliClientID: 152a9c4e-b450-4b17-81da-d80eb7f64d6a
      enablePKCEAuthentication: true
      requestedScopes: [openid, profile, email, public-only]
  rbac:
    policy.default: role:readonly
    # Bind vancanhuit@gmail.com's Gitea user ID, not a mutable email or group.
    policy.csv: |
      g, 2, role:admin
    scopes: '[]'
  params:
    # Envoy terminates HTTPS; the backend stays on its internal ClusterIP.
    server.insecure: true

dex:
  enabled: false

server:
  service:
    servicePortHttp2: 8080
    servicePortHttp2AppProtocol: kubernetes.io/h2c
  httproute:
    # The built-in route fixes every backend to port 80; RPC needs HTTP/2.
    enabled: false

extraObjects:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: argocd-server
      namespace: argocd
    spec:
      parentRefs:
        - name: lab-gateway
          namespace: kube-system
          sectionName: argocd-https
      hostnames:
        - argocd.lab.canhdinh.com
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
              headers:
                - name: Content-Type
                  type: RegularExpression
                  value: ^application/grpc.*$
          backendRefs:
            - name: argocd-server
              port: 8080
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - name: argocd-server
              port: 80
