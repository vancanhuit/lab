apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: oci://ghcr.io/external-secrets/charts/external-secrets
      targetRevision: sha256:77744a13f72022d9193556df4b7e9d338ba281553a0cef31f6a8ec9924425e65
      path: .
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/kubernetes/external-secrets/values.yaml
    - repoURL: https://github.com/vancanhuit/lab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  # Track the existing release; adoption and later updates require manual sync.
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
