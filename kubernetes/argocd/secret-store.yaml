apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: argocd
spec:
  provider:
    vault:
      server: https://vault.lab.canhdinh.com
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-argocd
          serviceAccountRef:
            name: vault-auth
            audiences:
              - vault
              - https://kubernetes.default.svc.cluster.local
