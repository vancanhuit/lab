apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-gitea-oidc
  namespace: argocd
spec:
  refreshPolicy: Periodic
  refreshInterval: 1m
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: argocd-gitea-oidc
    # Keep SSO available if this ExternalSecret is removed during recovery.
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
  data:
    - secretKey: client-secret
      remoteRef:
        key: kubernetes/argocd/gitea-oidc
        property: client-secret
