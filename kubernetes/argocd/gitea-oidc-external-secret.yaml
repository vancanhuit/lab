apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-gitea-oidc
  namespace: argocd
  # ESO inherits this label and Argo's tracking annotation onto the target Secret.
  labels:
    app.kubernetes.io/part-of: argocd
spec:
  refreshPolicy: Periodic
  refreshInterval: 1m
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: argocd-gitea-oidc
    # Keep SSO available if this ExternalSecret is removed during recovery.
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
    - secretKey: client-secret
      remoteRef:
        key: kubernetes/argocd/gitea-oidc
        property: client-secret
