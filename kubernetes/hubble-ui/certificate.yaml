---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hubble-ui
  namespace: kube-system
spec:
  secretName: hubble-ui-tls
  dnsNames:
    - hubble-ui.lab.canhdinh.com
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
