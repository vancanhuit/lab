apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: vault-secrets
spec:
  provider:
    vault:
      server: https://vault.lab.canhdinh.com
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-vault-secrets
          serviceAccountRef:
            name: vault-auth
            # The JWT is both the Vault credential and the TokenReview bearer token.
            audiences:
              - vault
              - https://kubernetes.default.svc.cluster.local
