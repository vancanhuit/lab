---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  # Preserve the live name when sharing its host-network ports with more apps.
  name: hubble-ui
  namespace: kube-system
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      hostname: hubble-ui.lab.canhdinh.com
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      hostname: hubble-ui.lab.canhdinh.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: hubble-ui-tls
      allowedRoutes:
        namespaces:
          from: Same
    - name: argocd-http
      hostname: argocd.lab.canhdinh.com
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
    - name: argocd-https
      hostname: argocd.lab.canhdinh.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: argocd-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
