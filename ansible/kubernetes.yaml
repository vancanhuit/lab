---
- name: Prepare Kubernetes nodes
  hosts: kubernetes
  become: true
  any_errors_fatal: true
  roles:
    - kubernetes

- name: Bootstrap the Kubernetes control plane and Cilium
  hosts: k8s_control_plane
  become: true
  any_errors_fatal: true
  tasks:
    - name: Initialize the control plane
      ansible.builtin.include_role:
        name: kubernetes
        tasks_from: control-plane

- name: Join Kubernetes workers
  hosts: k8s_workers
  become: true
  tasks:
    - name: Join unconfigured workers with a short-lived bootstrap token
      ansible.builtin.command:
        argv: >-
          {{ hostvars[groups['k8s_control_plane'][0]].kubernetes_join_command.stdout.split() +
             ['--cri-socket', 'unix:///run/containerd/containerd.sock', '--node-name', inventory_hostname] }}
        creates: /etc/kubernetes/kubelet.conf
      when: not kubernetes_kubelet_state.stat.exists
      no_log: true

- name: Remove the temporary bootstrap token
  hosts: k8s_control_plane
  become: true
  tasks:
    - name: Revoke the worker bootstrap token
      ansible.builtin.command:
        argv:
          - /usr/local/bin/kubeadm
          - token
          - delete
          - "{{ kubernetes_join_command.stdout.split()[4].split('.')[0] }}"
      when: kubernetes_join_command is not skipped
      changed_when: true
      no_log: true

- name: Reconcile Gateway edge node roles
  hosts: k8s_control_plane
  become: true
  tasks:
    - name: Read current node labels
      ansible.builtin.command:
        cmd: /usr/local/bin/kubectl --kubeconfig /etc/kubernetes/admin.conf get nodes -o json
      register: kubernetes_current_nodes
      changed_when: false

    - name: Label inventory edge nodes after they have joined
      ansible.builtin.command:
        argv:
          - /usr/local/bin/kubectl
          - --kubeconfig
          - /etc/kubernetes/admin.conf
          - label
          - node
          - "{{ item.metadata.name }}"
          - node-role.kubernetes.io/edge=
      loop: "{{ (kubernetes_current_nodes.stdout | from_json)['items'] }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      when:
        - item.metadata.name in groups['k8s_edge']
        - "'node-role.kubernetes.io/edge' not in item.metadata.labels"
      changed_when: true

- name: Verify the deployed Kubernetes cluster
  ansible.builtin.import_playbook: verify-kubernetes.yaml
