---
- name: Verify Uptime Kuma deployment
  hosts: kuma
  become: true
  tasks:
    - name: Check Node.js version
      ansible.builtin.command:
        cmd: node --version
      register: uptime_kuma_node_check
      changed_when: false
      failed_when: uptime_kuma_node_check.stdout != 'v24.21.0'

    - name: Check Uptime Kuma version
      ansible.builtin.command:
        argv:
          - node
          - -p
          - require('/opt/uptime-kuma/current/package.json').version
      register: uptime_kuma_version_check
      changed_when: false
      failed_when: uptime_kuma_version_check.stdout != '2.5.4'

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert required services are running and enabled
      ansible.builtin.assert:
        that:
          - ansible_facts.services['uptime-kuma.service'].state == 'running'
          - ansible_facts.services['uptime-kuma.service'].status == 'enabled'
          - ansible_facts.services['nginx.service'].state == 'running'
          - ansible_facts.services['nginx.service'].status == 'enabled'

    - name: Check required timers are enabled # noqa command-instead-of-module
      ansible.builtin.command: >
        systemctl is-enabled lego-renew.timer uptime-kuma-backup.timer
      register: uptime_kuma_timers_enabled
      changed_when: false

    - name: Check required timers are active # noqa command-instead-of-module
      ansible.builtin.command: >
        systemctl is-active lego-renew.timer uptime-kuma-backup.timer
      register: uptime_kuma_timers_active
      changed_when: false

    - name: Assert timer enabled and active state
      ansible.builtin.assert:
        that:
          - uptime_kuma_timers_enabled.stdout_lines == ['enabled', 'enabled']
          - uptime_kuma_timers_active.stdout_lines == ['active', 'active']

    - name: Read TCP listeners
      ansible.builtin.command:
        cmd: ss -H -ltnp
      register: uptime_kuma_listener_check
      changed_when: false

    - name: Verify Uptime Kuma listener boundaries
      ansible.builtin.import_tasks: roles/uptime_kuma/tasks/verify-listeners.yaml

    - name: Validate Nginx configuration
      ansible.builtin.command:
        cmd: /usr/sbin/nginx -t
      changed_when: false

    - name: Check Kuma HTTPS endpoint
      ansible.builtin.uri:
        url: https://kuma.lab.canhdinh.com/
        validate_certs: true
        follow_redirects: none
        status_code: [200, 302]
      changed_when: false

    - name: Check certificate validity and subject alternative name
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          openssl s_client -connect kuma.lab.canhdinh.com:443 \
            -servername kuma.lab.canhdinh.com </dev/null 2>/dev/null |
            openssl x509 -checkend 604800 -noout -ext subjectAltName
        executable: /bin/bash
      register: uptime_kuma_certificate_check
      changed_when: false
      failed_when: >-
        uptime_kuma_certificate_check.rc != 0 or
        'DNS:kuma.lab.canhdinh.com' not in uptime_kuma_certificate_check.stdout

    - name: Read protected path metadata
      ansible.builtin.stat:
        path: "{{ item.path }}"
      loop:
        - { path: /var/lib/uptime-kuma, label: data directory, owner: kuma, group: null, mode: '0700' }
        - { path: /var/backups/uptime-kuma, label: backup directory, owner: root, group: null, mode: '0700' }
        - { path: /etc/uptime-kuma/tls/server.crt, label: TLS certificate, owner: null, group: null, mode: '0644' }
        - { path: /etc/uptime-kuma/tls/server.key, label: TLS private key, owner: null, group: www-data, mode: '0640' }
      register: uptime_kuma_protected_paths

    - name: Verify Uptime Kuma protected paths
      ansible.builtin.import_tasks: roles/uptime_kuma/tasks/verify-paths.yaml

    - name: Create an on-demand Uptime Kuma backup
      ansible.builtin.systemd_service:
        name: uptime-kuma-backup.service
        state: started

    - name: Find Uptime Kuma backup archives
      ansible.builtin.find:
        paths: /var/backups/uptime-kuma
        patterns: 'kuma-*.db.gz'
        file_type: file
      register: uptime_kuma_backup_archives

    - name: Assert at least one backup archive exists
      ansible.builtin.assert:
        that:
          - uptime_kuma_backup_archives.files | length > 0
        fail_msg: No backup archives found in /var/backups/uptime-kuma matching kuma-*.db.gz

    - name: Select newest Uptime Kuma backup
      ansible.builtin.set_fact:
        uptime_kuma_newest_backup: >-
          {{ (uptime_kuma_backup_archives.files |
              sort(attribute='mtime', reverse=true) |
              first).path }}
      no_log: true

    - name: Validate newest Uptime Kuma backup
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          temporary_database="$(mktemp)"
          trap 'rm -f "$temporary_database"' EXIT HUP INT TERM
          gzip -dc "{{ uptime_kuma_newest_backup }}" > "$temporary_database"
          test "$(sqlite3 "$temporary_database" 'PRAGMA quick_check;')" = "ok"
        executable: /bin/bash
      changed_when: false
      no_log: true
