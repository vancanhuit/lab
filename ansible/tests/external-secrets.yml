---
- name: Validate External Secrets and Vault access boundaries without credentials
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    eso_root: "{{ playbook_dir }}/../../kubernetes/external-secrets"
    vault_root: "{{ playbook_dir }}/../../vault/kubernetes"
    auth_resources: "{{ lookup('ansible.builtin.file', eso_root ~ '/vault-auth.yaml') | from_yaml_all | list }}"
    store: "{{ lookup('ansible.builtin.file', eso_root ~ '/secret-store.yaml') | from_yaml }}"
    example: "{{ lookup('ansible.builtin.file', eso_root ~ '/example.yaml') | from_yaml }}"
    vault_role: "{{ lookup('ansible.builtin.file', vault_root ~ '/eso-vault-secrets.json') | from_json }}"
    vault_policy: "{{ lookup('ansible.builtin.file', vault_root ~ '/eso-vault-secrets.hcl') }}"
    vault_integration_files:
      - external-secrets/vault-auth.yaml
      - external-secrets/secret-store.yaml
      - argocd/vault-auth.yaml
      - argocd/secret-store.yaml
      - argocd/gitea-oidc-external-secret.yaml
      - cert-manager/vault-auth.yaml
      - cert-manager/secret-store.yaml
      - cert-manager/cloudflare-external-secret.yaml
    integrations:
      - namespace: cert-manager
        key: kubernetes/cert-manager/cloudflare-api-token
        property: api-token
        backup: cloudflare-api-token.sops.yaml
        manifest: cloudflare-external-secret.yaml
      - namespace: argocd
        key: kubernetes/argocd/gitea-oidc
        property: client-secret
        backup: gitea-oidc.sops.yaml
        manifest: gitea-oidc-external-secret.yaml
  tasks:
    - name: Assert Argo tracks the existing ESO release using the same pinned chart and Git values
      ansible.builtin.assert:
        that:
          - application.apiVersion == 'argoproj.io/v1alpha1' and application.kind == 'Application'
          - application.metadata.name == 'external-secrets' and application.metadata.namespace == 'argocd'
          - not application.metadata.get('finalizers', [])
          - application.spec.project == 'default'
          - application.spec.destination == {'server':'https://kubernetes.default.svc','namespace':'external-secrets'}
          - application.spec.sources | length == 2
          - chart.repoURL == 'oci://ghcr.io/external-secrets/charts/external-secrets'
          - chart.targetRevision == 'sha256:77744a13f72022d9193556df4b7e9d338ba281553a0cef31f6a8ec9924425e65'
          - chart.path == '.'
          - "chart.helm == {'releaseName':'external-secrets','valueFiles':['$values/kubernetes/external-secrets/values.yaml']}"
          - "application.spec.sources[1] == {'repoURL':'https://github.com/vancanhuit/lab.git','targetRevision':'main','ref':'values'}"
          - application.spec.syncPolicy == {'syncOptions':['ServerSideApply=true']}
      vars:
        application: "{{ lookup('ansible.builtin.file', eso_root ~ '/../argocd/applications/external-secrets.yaml') | from_yaml }}"
        chart: "{{ application.spec.sources[0] }}"

    - name: Assert Vault integration tracking explicitly excludes backups and generated Secrets
      ansible.builtin.assert:
        that:
          - application.apiVersion == 'argoproj.io/v1alpha1' and application.kind == 'Application'
          - application.metadata.name == 'vault-integrations' and application.metadata.namespace == 'argocd'
          - not application.metadata.get('finalizers', [])
          - application.spec.project == 'default'
          - application.spec.destination == {'server':'https://kubernetes.default.svc','namespace':'vault-secrets'}
          - application.spec.get('sources') is none
          - source.repoURL == 'https://github.com/vancanhuit/lab.git' and source.targetRevision == 'main'
          - source.path == 'kubernetes'
          - source.directory == {'recurse':true,'include':'{' ~ vault_integration_files | join(',') ~ '}'}
          - application.spec.syncPolicy == {'syncOptions':['ServerSideApply=true']}
      vars:
        application: "{{ lookup('ansible.builtin.file', eso_root ~ '/../argocd/applications/vault-integrations.yaml') | from_yaml }}"
        source: "{{ application.spec.source }}"

    - name: Require allowlisted files to contain only Vault integration resources
      ansible.builtin.assert:
        that:
          - resources | length > 0
          - >-
            resources | map(attribute='kind') | difference(['Namespace', 'ServiceAccount', 'ClusterRole',
            'ClusterRoleBinding', 'Role', 'RoleBinding', 'SecretStore', 'ExternalSecret']) | length == 0
          - >-
            resources | selectattr('kind', 'equalto', 'ExternalSecret') | map(attribute='metadata.name') |
            difference(['argocd-gitea-oidc', 'cloudflare-api-token']) | length == 0
      vars:
        resources: "{{ lookup('ansible.builtin.file', eso_root ~ '/../' ~ item) | from_yaml_all | list }}"
      loop: "{{ vault_integration_files }}"

    - name: Render the pinned operator chart without a cluster
      ansible.builtin.command:
        argv:
          - helm
          - template
          - external-secrets
          - oci://ghcr.io/external-secrets/charts/external-secrets@sha256:77744a13f72022d9193556df4b7e9d338ba281553a0cef31f6a8ec9924425e65
          - --version
          - 2.13.0
          - --namespace
          - external-secrets
          - --kube-version
          - 1.36.5
          - --include-crds
          - --values
          - "{{ eso_root }}/values.yaml"
      register: eso_render
      changed_when: false

    - name: Assert hardened controller and disabled cluster-wide or push reconcilers
      ansible.builtin.assert:
        that:
          - controller.image == 'ghcr.io/external-secrets/external-secrets:v2.13.0'
          - controller.securityContext.runAsNonRoot
          - controller.securityContext.readOnlyRootFilesystem
          - not controller.securityContext.allowPrivilegeEscalation
          - controller.securityContext.capabilities.drop == ['ALL']
          - controller.readinessProbe.httpGet.path == '/readyz'
          - not pod.hostNetwork
          - pod.serviceAccountName == 'external-secrets'
          - "'--enable-cluster-store-reconciler=false' in controller.args"
          - "'--enable-cluster-external-secret-reconciler=false' in controller.args"
          - "'--enable-cluster-push-secret-reconciler=false' in controller.args"
          - "'--enable-push-secret-reconciler=false' in controller.args"
          - crds | length > 0
          - "'clustersecretstores.external-secrets.io' not in crd_names"
          - "'clusterexternalsecrets.external-secrets.io' not in crd_names"
          - "'pushsecrets.external-secrets.io' not in crd_names"
          - "'clusterpushsecrets.external-secrets.io' not in crd_names"
      vars:
        rendered: "{{ eso_render.stdout | from_yaml_all | list }}"
        pod: >-
          {{ (rendered | selectattr('kind', 'equalto', 'Deployment') |
              selectattr('metadata.name', 'equalto', 'external-secrets') | first).spec.template.spec }}
        controller: "{{ pod.containers[0] }}"
        crds: "{{ rendered | selectattr('kind', 'equalto', 'CustomResourceDefinition') | list }}"
        crd_names: "{{ crds | map(attribute='metadata.name') | list }}"

    - name: Require retained CRDs
      ansible.builtin.assert:
        that:
          - item.metadata.annotations['helm.sh/resource-policy'] == 'keep'
        quiet: true
      loop: "{{ eso_render.stdout | from_yaml_all | selectattr('kind', 'equalto', 'CustomResourceDefinition') | list }}"
      loop_control:
        label: "{{ item.metadata.name }}"

    - name: Prevent chart-wide TokenRequest grants
      ansible.builtin.assert:
        that:
          - "'serviceaccounts/token' not in (item.rules | map(attribute='resources') | flatten)"
        quiet: true
      loop: "{{ eso_render.stdout | from_yaml_all | selectattr('kind', 'equalto', 'ClusterRole') | list }}"
      loop_control:
        label: "{{ item.metadata.name }}"

    - name: Assert explicit namespace and service-account RBAC
      ansible.builtin.assert:
        that:
          - auth_resources | map(attribute='kind') | list == ['Namespace', 'ServiceAccount', 'ClusterRole', 'ClusterRoleBinding', 'Role', 'RoleBinding']
          - auth_resources[0].metadata.name == 'vault-secrets'
          - not auth_resources[1].automountServiceAccountToken
          - "auth_resources[2].rules == [{'apiGroups':['authentication.k8s.io'], 'resources':['tokenreviews'], 'verbs':['create']}]"
          - auth_resources[3].roleRef.name == auth_resources[2].metadata.name
          - "auth_resources[3].subjects == [{'kind':'ServiceAccount', 'name':'vault-auth', 'namespace':'vault-secrets'}]"
          - "auth_resources[4].rules == [{'apiGroups':[''], 'resources':['serviceaccounts/token'], 'resourceNames':['vault-auth'], 'verbs':['create']}]"
          - auth_resources[4].metadata.namespace == auth_resources[5].metadata.namespace == 'vault-secrets'
          - auth_resources[5].roleRef.name == auth_resources[4].metadata.name
          - "auth_resources[5].subjects == [{'kind':'ServiceAccount', 'name':'external-secrets', 'namespace':'external-secrets'}]"

    - name: Assert trusted TLS and namespaced short-lived Kubernetes authentication
      ansible.builtin.assert:
        that:
          - store.apiVersion == example.apiVersion == 'external-secrets.io/v1'
          - store.kind == 'SecretStore'
          - store.metadata.namespace == example.metadata.namespace == 'vault-secrets'
          - provider.server == 'https://vault.lab.canhdinh.com'
          - provider.path == 'secret' and provider.version == 'v2'
          - "provider.auth.keys() | list == ['kubernetes']"
          - provider.auth.kubernetes.mountPath == 'kubernetes'
          - provider.auth.kubernetes.role == 'eso-vault-secrets'
          - provider.auth.kubernetes.serviceAccountRef.name == auth_resources[1].metadata.name
          - "provider.auth.kubernetes.serviceAccountRef.audiences == ['vault', 'https://kubernetes.default.svc.cluster.local']"
          - vault_role.bound_service_account_names == ['vault-auth']
          - vault_role.bound_service_account_namespaces == [store.metadata.namespace]
          - vault_role.audience == 'vault'
          - vault_role.alias_name_source == 'serviceaccount_uid'
          - vault_role.token_policies == ['eso-vault-secrets']
          - vault_role.token_no_default_policy
          - vault_role.token_ttl == '10m'
          - vault_role.token_max_ttl == vault_role.token_explicit_max_ttl == '1h'
          - example.spec.secretStoreRef.name == store.metadata.name
          - example.spec.secretStoreRef.kind == store.kind
          - example.spec.refreshInterval == '1m'
          - example.spec.target.creationPolicy == 'Owner'
          - example.spec.target.deletionPolicy == 'Retain'
          - example.spec.data | map(attribute='remoteRef.key') | unique | list == ['kubernetes/vault-secrets/example']
      vars:
        provider: "{{ store.spec.provider.vault }}"

    - name: Require read-only KV prefix and own-token management only
      ansible.builtin.assert:
        that:
          - vault_policy is search('path "secret/data/kubernetes/vault-secrets/\*" \{\s+capabilities = \["read"\]\s+\}')
          - >-
            vault_policy | regex_findall('path "([^"]+)"') ==
            ['secret/data/kubernetes/vault-secrets/*', 'auth/token/lookup-self', 'auth/token/renew-self', 'auth/token/revoke-self']
          - vault_policy is not search('"create"|"delete"|"list"|"patch"|"sudo"')

    - name: Assert each application has its own identity and narrowly scoped TokenRequest grant
      ansible.builtin.assert:
        that:
          - resources | map(attribute='kind') | list == ['ServiceAccount', 'ClusterRoleBinding', 'Role', 'RoleBinding']
          - resources[0].metadata.name == 'vault-auth'
          - resources[0].metadata.namespace == item.namespace
          - not resources[0].automountServiceAccountToken
          - resources[1].roleRef == auth_resources[3].roleRef
          - "resources[1].subjects == [{'kind':'ServiceAccount', 'name':'vault-auth', 'namespace':item.namespace}]"
          - resources[2].rules == auth_resources[4].rules
          - resources[2].metadata.namespace == resources[3].metadata.namespace == item.namespace
          - resources[3].roleRef.name == resources[2].metadata.name
          - resources[3].subjects == auth_resources[5].subjects
      vars:
        root: "{{ playbook_dir }}/../../kubernetes/{{ item.namespace }}"
        resources: "{{ lookup('ansible.builtin.file', root ~ '/vault-auth.yaml') | from_yaml_all | list }}"
      loop: "{{ integrations }}"
      loop_control:
        label: "{{ item.namespace }}"

    - name: Assert each application Vault role can read only its exact source key
      ansible.builtin.assert:
        that:
          - app_store == store | combine({'metadata':{'name':'vault', 'namespace':item.namespace}, 'spec':app_spec})
          - app_role == vault_role | combine(app_bindings)
          - app_policy == vault_policy | replace('secret/data/kubernetes/vault-secrets/*', 'secret/data/' ~ item.key)
          - external.apiVersion == store.apiVersion
          - external.kind == 'ExternalSecret'
          - external.metadata.namespace == app_store.metadata.namespace
          - external.spec.secretStoreRef == {'name':app_store.metadata.name,'kind':'SecretStore'}
          - external.spec.refreshPolicy == 'Periodic' and external.spec.refreshInterval == '1m'
          - external.spec.target.name == backup.metadata.name
          - external.spec.target.creationPolicy == 'Orphan' and external.spec.target.deletionPolicy == 'Retain'
          - external.spec.target.get('template') is none
          - backup.metadata.namespace == app_store.metadata.namespace
          - backup.data[item.property] is match('^ENC\[AES256_GCM,')
          - >-
            external.spec.data == [{'secretKey':item.property, 'remoteRef':
            {'key':item.key, 'property':item.property}}]
      vars:
        root: "{{ playbook_dir }}/../../kubernetes/{{ item.namespace }}"
        app_store: "{{ lookup('ansible.builtin.file', root ~ '/secret-store.yaml') | from_yaml }}"
        app_spec: "{{ store.spec | combine({'provider': {'vault': {'auth': {'kubernetes': {'role': 'eso-' ~ item.namespace}}}}}, recursive=true) }}"
        app_role: "{{ lookup('ansible.builtin.file', vault_root ~ '/eso-' ~ item.namespace ~ '.json') | from_json }}"
        app_bindings:
          bound_service_account_namespaces: ["{{ item.namespace }}"]
          token_policies: ["eso-{{ item.namespace }}"]
        app_policy: "{{ lookup('ansible.builtin.file', vault_root ~ '/eso-' ~ item.namespace ~ '.hcl') }}"
        external: "{{ lookup('ansible.builtin.file', root ~ '/' ~ item.manifest) | from_yaml }}"
        backup: "{{ lookup('ansible.builtin.file', root ~ '/' ~ item.backup) | from_yaml }}"
      loop: "{{ integrations }}"
      loop_control:
        label: "{{ item.namespace }}"

    - name: Assert credential references and inherited Argo Secret discovery label are preserved
      ansible.builtin.assert:
        that:
          - cloudflare.spec.target.name == issuer.spec.acme.solvers[0].dns01.cloudflare.apiTokenSecretRef.name
          - cloudflare.spec.data[0].secretKey == issuer.spec.acme.solvers[0].dns01.cloudflare.apiTokenSecretRef.key
          - oidc.clientSecret == '$' ~ argocd.spec.target.name ~ ':' ~ argocd.spec.data[0].secretKey
          - "argocd.metadata.labels == backup.metadata.labels == {'app.kubernetes.io/part-of':'argocd'}"
          - oidc.cliClientID is defined and oidc.get('cliClientSecret') is none
      vars:
        root: "{{ playbook_dir }}/../../kubernetes"
        cloudflare: "{{ lookup('ansible.builtin.file', root ~ '/cert-manager/cloudflare-external-secret.yaml') | from_yaml }}"
        issuer: "{{ lookup('ansible.builtin.file', root ~ '/cert-manager/issuer.yaml') | from_yaml }}"
        argocd: "{{ lookup('ansible.builtin.file', root ~ '/argocd/gitea-oidc-external-secret.yaml') | from_yaml }}"
        backup: "{{ lookup('ansible.builtin.file', root ~ '/argocd/gitea-oidc.sops.yaml') | from_yaml }}"
        values: "{{ lookup('ansible.builtin.file', root ~ '/argocd/values.yaml') | from_yaml }}"
        oidc: "{{ values.configs.cm['oidc.config'] | from_yaml }}"
