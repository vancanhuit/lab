---
- name: Validate External Secrets and Vault access boundaries without credentials
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    eso_root: "{{ playbook_dir }}/../../kubernetes/external-secrets"
    vault_root: "{{ playbook_dir }}/../../vault/kubernetes"
    auth_resources: "{{ lookup('ansible.builtin.file', eso_root ~ '/vault-auth.yaml') | from_yaml_all | list }}"
    store: "{{ lookup('ansible.builtin.file', eso_root ~ '/secret-store.yaml') | from_yaml }}"
    example: "{{ lookup('ansible.builtin.file', eso_root ~ '/example.yaml') | from_yaml }}"
    vault_role: "{{ lookup('ansible.builtin.file', vault_root ~ '/eso-vault-secrets.json') | from_json }}"
    vault_policy: "{{ lookup('ansible.builtin.file', vault_root ~ '/eso-vault-secrets.hcl') }}"
  tasks:
    - name: Render the pinned operator chart without a cluster
      ansible.builtin.command:
        argv:
          - helm
          - template
          - external-secrets
          - oci://ghcr.io/external-secrets/charts/external-secrets@sha256:77744a13f72022d9193556df4b7e9d338ba281553a0cef31f6a8ec9924425e65
          - --version
          - 2.13.0
          - --namespace
          - external-secrets
          - --kube-version
          - 1.36.5
          - --include-crds
          - --values
          - "{{ eso_root }}/values.yaml"
      register: eso_render
      changed_when: false

    - name: Assert hardened controller and disabled cluster-wide or push reconcilers
      ansible.builtin.assert:
        that:
          - controller.image == 'ghcr.io/external-secrets/external-secrets:v2.13.0'
          - controller.securityContext.runAsNonRoot
          - controller.securityContext.readOnlyRootFilesystem
          - not controller.securityContext.allowPrivilegeEscalation
          - controller.securityContext.capabilities.drop == ['ALL']
          - controller.readinessProbe.httpGet.path == '/readyz'
          - not pod.hostNetwork
          - pod.serviceAccountName == 'external-secrets'
          - "'--enable-cluster-store-reconciler=false' in controller.args"
          - "'--enable-cluster-external-secret-reconciler=false' in controller.args"
          - "'--enable-cluster-push-secret-reconciler=false' in controller.args"
          - "'--enable-push-secret-reconciler=false' in controller.args"
          - crds | length > 0
          - "'clustersecretstores.external-secrets.io' not in crd_names"
          - "'clusterexternalsecrets.external-secrets.io' not in crd_names"
          - "'pushsecrets.external-secrets.io' not in crd_names"
          - "'clusterpushsecrets.external-secrets.io' not in crd_names"
      vars:
        rendered: "{{ eso_render.stdout | from_yaml_all | list }}"
        pod: >-
          {{ (rendered | selectattr('kind', 'equalto', 'Deployment') |
              selectattr('metadata.name', 'equalto', 'external-secrets') | first).spec.template.spec }}
        controller: "{{ pod.containers[0] }}"
        crds: "{{ rendered | selectattr('kind', 'equalto', 'CustomResourceDefinition') | list }}"
        crd_names: "{{ crds | map(attribute='metadata.name') | list }}"

    - name: Require retained CRDs
      ansible.builtin.assert:
        that:
          - item.metadata.annotations['helm.sh/resource-policy'] == 'keep'
        quiet: true
      loop: "{{ eso_render.stdout | from_yaml_all | selectattr('kind', 'equalto', 'CustomResourceDefinition') | list }}"
      loop_control:
        label: "{{ item.metadata.name }}"

    - name: Prevent chart-wide TokenRequest grants
      ansible.builtin.assert:
        that:
          - "'serviceaccounts/token' not in (item.rules | map(attribute='resources') | flatten)"
        quiet: true
      loop: "{{ eso_render.stdout | from_yaml_all | selectattr('kind', 'equalto', 'ClusterRole') | list }}"
      loop_control:
        label: "{{ item.metadata.name }}"

    - name: Assert explicit namespace and service-account RBAC
      ansible.builtin.assert:
        that:
          - auth_resources | map(attribute='kind') | list == ['Namespace', 'ServiceAccount', 'ClusterRole', 'ClusterRoleBinding', 'Role', 'RoleBinding']
          - auth_resources[0].metadata.name == 'vault-secrets'
          - not auth_resources[1].automountServiceAccountToken
          - "auth_resources[2].rules == [{'apiGroups':['authentication.k8s.io'], 'resources':['tokenreviews'], 'verbs':['create']}]"
          - auth_resources[3].roleRef.name == auth_resources[2].metadata.name
          - "auth_resources[3].subjects == [{'kind':'ServiceAccount', 'name':'vault-auth', 'namespace':'vault-secrets'}]"
          - "auth_resources[4].rules == [{'apiGroups':[''], 'resources':['serviceaccounts/token'], 'resourceNames':['vault-auth'], 'verbs':['create']}]"
          - auth_resources[4].metadata.namespace == auth_resources[5].metadata.namespace == 'vault-secrets'
          - auth_resources[5].roleRef.name == auth_resources[4].metadata.name
          - "auth_resources[5].subjects == [{'kind':'ServiceAccount', 'name':'external-secrets', 'namespace':'external-secrets'}]"

    - name: Assert trusted TLS and namespaced short-lived Kubernetes authentication
      ansible.builtin.assert:
        that:
          - store.apiVersion == example.apiVersion == 'external-secrets.io/v1'
          - store.kind == 'SecretStore'
          - store.metadata.namespace == example.metadata.namespace == 'vault-secrets'
          - provider.server == 'https://vault.lab.canhdinh.com'
          - provider.path == 'secret' and provider.version == 'v2'
          - "provider.auth.keys() | list == ['kubernetes']"
          - provider.auth.kubernetes.mountPath == 'kubernetes'
          - provider.auth.kubernetes.role == 'eso-vault-secrets'
          - provider.auth.kubernetes.serviceAccountRef.name == auth_resources[1].metadata.name
          - "provider.auth.kubernetes.serviceAccountRef.audiences == ['vault', 'https://kubernetes.default.svc.cluster.local']"
          - vault_role.bound_service_account_names == ['vault-auth']
          - vault_role.bound_service_account_namespaces == [store.metadata.namespace]
          - vault_role.audience == 'vault'
          - vault_role.alias_name_source == 'serviceaccount_uid'
          - vault_role.token_policies == ['eso-vault-secrets']
          - vault_role.token_no_default_policy
          - vault_role.token_ttl == '10m'
          - vault_role.token_max_ttl == vault_role.token_explicit_max_ttl == '1h'
          - example.spec.secretStoreRef.name == store.metadata.name
          - example.spec.secretStoreRef.kind == store.kind
          - example.spec.refreshInterval == '1m'
          - example.spec.target.creationPolicy == 'Owner'
          - example.spec.target.deletionPolicy == 'Retain'
          - example.spec.data | map(attribute='remoteRef.key') | unique | list == ['kubernetes/vault-secrets/example']
      vars:
        provider: "{{ store.spec.provider.vault }}"

    - name: Require read-only KV prefix and own-token management only
      ansible.builtin.assert:
        that:
          - vault_policy is search('path "secret/data/kubernetes/vault-secrets/\*" \{\s+capabilities = \["read"\]\s+\}')
          - >-
            vault_policy | regex_findall('path "([^"]+)"') ==
            ['secret/data/kubernetes/vault-secrets/*', 'auth/token/lookup-self', 'auth/token/renew-self', 'auth/token/revoke-self']
          - vault_policy is not search('"create"|"delete"|"list"|"patch"|"sudo"')
