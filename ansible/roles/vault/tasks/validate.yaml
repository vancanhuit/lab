---
- name: Require the supported Vault host and pinned release
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Debian'
      - ansible_facts.distribution_major_version == '13'
      - ansible_facts.architecture == 'x86_64'
      - vault_domain == 'vault.lab.canhdinh.com'
      - vault_version == '2.2.1'
      - vault_archive_sha256 == '079435de8ff146bdec4cdbe3be71d672ef4e59e4df6af0f2dba672e71be21a68'
    quiet: true

- name: Require swap to be disabled for Raft storage
  ansible.builtin.assert:
    that:
      - ansible_facts.swaptotal_mb | int == 0
    fail_msg: Disable swap on the Incus host before running Vault with disable_mlock
    quiet: true
