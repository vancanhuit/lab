---
- name: Validate Uptime Kuma role contract
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_facts:
      distribution: Debian
      distribution_major_version: '13'
      architecture: x86_64
  tasks:
    - name: Load Uptime Kuma role defaults
      ansible.builtin.include_vars:
        file: "{{ (playbook_dir | dirname) ~ '/defaults/main.yaml' }}"
        name: uptime_kuma_role_defaults

    - name: Backfill unset values from role defaults
      ansible.builtin.set_fact:
        uptime_kuma_version: "{{ uptime_kuma_version | default(uptime_kuma_role_defaults.uptime_kuma_version) }}"
        uptime_kuma_release_commit: "{{ uptime_kuma_release_commit | default(uptime_kuma_role_defaults.uptime_kuma_release_commit) }}"
        uptime_kuma_node_major: "{{ uptime_kuma_node_major | default(uptime_kuma_role_defaults.uptime_kuma_node_major) }}"
        uptime_kuma_user: "{{ uptime_kuma_user | default(uptime_kuma_role_defaults.uptime_kuma_user) }}"
        uptime_kuma_group: "{{ uptime_kuma_group | default(uptime_kuma_role_defaults.uptime_kuma_group) }}"
        uptime_kuma_admin_username: "{{ uptime_kuma_admin_username | default(uptime_kuma_role_defaults.uptime_kuma_admin_username) }}"
        uptime_kuma_domain: "{{ uptime_kuma_domain | default(uptime_kuma_role_defaults.uptime_kuma_domain) }}"
        uptime_kuma_bind_address: "{{ uptime_kuma_bind_address | default(uptime_kuma_role_defaults.uptime_kuma_bind_address) }}"
        uptime_kuma_port: "{{ uptime_kuma_port | default(uptime_kuma_role_defaults.uptime_kuma_port) }}"
        uptime_kuma_https_port: "{{ uptime_kuma_https_port | default(uptime_kuma_role_defaults.uptime_kuma_https_port) }}"
        uptime_kuma_install_root: "{{ uptime_kuma_install_root | default(uptime_kuma_role_defaults.uptime_kuma_install_root) }}"
        uptime_kuma_data_directory: "{{ uptime_kuma_data_directory | default(uptime_kuma_role_defaults.uptime_kuma_data_directory) }}"
        uptime_kuma_npm_cache_directory: "{{ uptime_kuma_npm_cache_directory | default(uptime_kuma_role_defaults.uptime_kuma_npm_cache_directory) }}"
        uptime_kuma_backup_directory: "{{ uptime_kuma_backup_directory | default(uptime_kuma_role_defaults.uptime_kuma_backup_directory) }}"
        uptime_kuma_backup_retention_count: >-
          {{ uptime_kuma_backup_retention_count |
             default(uptime_kuma_role_defaults.uptime_kuma_backup_retention_count) }}
        uptime_kuma_backup_calendar: "{{ uptime_kuma_backup_calendar | default(uptime_kuma_role_defaults.uptime_kuma_backup_calendar) }}"
        uptime_kuma_backup_randomized_delay: >-
          {{ uptime_kuma_backup_randomized_delay |
             default(uptime_kuma_role_defaults.uptime_kuma_backup_randomized_delay) }}
        uptime_kuma_tls_directory: "{{ uptime_kuma_tls_directory | default(uptime_kuma_role_defaults.uptime_kuma_tls_directory) }}"
        uptime_kuma_tls_cert_path: "{{ uptime_kuma_tls_cert_path | default(uptime_kuma_role_defaults.uptime_kuma_tls_cert_path) }}"
        uptime_kuma_tls_key_path: "{{ uptime_kuma_tls_key_path | default(uptime_kuma_role_defaults.uptime_kuma_tls_key_path) }}"

    - name: Backfill derived path values from role defaults
      ansible.builtin.set_fact:
        uptime_kuma_release_path: "{{ uptime_kuma_release_path | default(uptime_kuma_role_defaults.uptime_kuma_release_path) }}"
        uptime_kuma_current_path: "{{ uptime_kuma_current_path | default(uptime_kuma_role_defaults.uptime_kuma_current_path) }}"

    - name: Run role validation for positive fixture
      ansible.builtin.import_tasks: "{{ (playbook_dir | dirname) ~ '/tasks/validate.yaml' }}"

    - name: Assert immutable contract values
      ansible.builtin.assert:
        that:
          - uptime_kuma_version == '2.5.0'
          - uptime_kuma_release_commit == 'd9a60dfc73140d15111752e4e8910ed4b54bd9a3'
          - uptime_kuma_node_major | int == 24
          - uptime_kuma_user == 'kuma'
          - uptime_kuma_bind_address == '127.0.0.1'
          - uptime_kuma_port | int == 3001
          - uptime_kuma_https_port | int == 443
          - uptime_kuma_backup_retention_count | int == 14

    - name: Test invalid external bind address
      block:
        - name: Set invalid bind address
          ansible.builtin.set_fact:
            uptime_kuma_bind_address: 0.0.0.0

        - name: Run validation with invalid bind address
          ansible.builtin.include_tasks: "{{ (playbook_dir | dirname) ~ '/tasks/validate.yaml' }}"

        - name: Fail when validation unexpectedly succeeds
          ansible.builtin.fail:
            msg: Validation accepted an externally reachable Kuma listener
      rescue:
        - name: Assert bind-address validation message
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('uptime_kuma_bind_address must be 127.0.0.1')
      always:
        - name: Restore valid bind address
          ansible.builtin.set_fact:
            uptime_kuma_bind_address: 127.0.0.1

    - name: Read installation task files
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - "{{ (playbook_dir | dirname) ~ '/tasks/install.yaml' }}"
        - "{{ (playbook_dir | dirname) ~ '/tasks/release.yaml' }}"
      register: uptime_kuma_install_task_files

    - name: Combine installation task content
      ansible.builtin.set_fact:
        uptime_kuma_install_tasks_rendered: >-
          {{ uptime_kuma_install_task_files.results |
             map(attribute='content') |
             map('b64decode') |
             join('\n') }}

    - name: Assert installation trust and release controls
      ansible.builtin.assert:
        that:
          - uptime_kuma_install_tasks_rendered is search('nodesource-repo\.gpg\.key')
          - uptime_kuma_install_tasks_rendered is search('uptime_kuma_nodesource_key_fingerprint')
          - uptime_kuma_role_defaults.uptime_kuma_nodesource_key_fingerprint == '6F71F525282841EEDAF851B42F59B5F99B1BE0B4'
          - uptime_kuma_install_tasks_rendered is search('ansible\.builtin\.deb822_repository')
          - uptime_kuma_install_tasks_rendered is not search('ansible\.builtin\.apt_repository')
          - uptime_kuma_install_tasks_rendered is search('python3-debian')
          - uptime_kuma_install_tasks_rendered is search('nodesource\.list')
          - uptime_kuma_install_tasks_rendered is search('node_.*\.x')
          - uptime_kuma_install_tasks_rendered is search('npm ci --omit=dev --no-audit')
          - uptime_kuma_install_tasks_rendered is search('npm run download-dist')
          - uptime_kuma_install_tasks_rendered is search('uptime_kuma_release_commit')
          - "uptime_kuma_install_tasks_rendered is search('state: link')"

    - name: Create temporary directory for template rendering
      ansible.builtin.tempfile:
        state: directory
      register: uptime_kuma_template_tmpdir

    - name: Render systemd service template
      ansible.builtin.template:
        src: "{{ (playbook_dir | dirname) ~ '/templates/uptime-kuma.service.j2' }}"
        dest: "{{ uptime_kuma_template_tmpdir.path }}/uptime-kuma.service"
        mode: '0600'

    - name: Render Nginx configuration template
      ansible.builtin.template:
        src: "{{ (playbook_dir | dirname) ~ '/templates/nginx.conf.j2' }}"
        dest: "{{ uptime_kuma_template_tmpdir.path }}/nginx.conf"
        mode: '0600'

    - name: Render Lego deploy hook template
      ansible.builtin.template:
        src: "{{ (playbook_dir | dirname) ~ '/templates/lego-deploy-hook.sh.j2' }}"
        dest: "{{ uptime_kuma_template_tmpdir.path }}/lego-deploy-hook.sh"
        mode: '0600'

    - name: Render backup script template
      ansible.builtin.template:
        src: "{{ (playbook_dir | dirname) ~ '/templates/uptime-kuma-backup.sh.j2' }}"
        dest: "{{ uptime_kuma_template_tmpdir.path }}/uptime-kuma-backup.sh"
        mode: '0600'

    - name: Render backup service template
      ansible.builtin.template:
        src: "{{ (playbook_dir | dirname) ~ '/templates/uptime-kuma-backup.service.j2' }}"
        dest: "{{ uptime_kuma_template_tmpdir.path }}/uptime-kuma-backup.service"
        mode: '0600'

    - name: Render backup timer template
      ansible.builtin.template:
        src: "{{ (playbook_dir | dirname) ~ '/templates/uptime-kuma-backup.timer.j2' }}"
        dest: "{{ uptime_kuma_template_tmpdir.path }}/uptime-kuma-backup.timer"
        mode: '0600'

    - name: Read rendered systemd service
      ansible.builtin.slurp:
        src: "{{ uptime_kuma_template_tmpdir.path }}/uptime-kuma.service"
      register: uptime_kuma_service_slurp

    - name: Read rendered Nginx configuration
      ansible.builtin.slurp:
        src: "{{ uptime_kuma_template_tmpdir.path }}/nginx.conf"
      register: uptime_kuma_nginx_slurp

    - name: Read rendered Lego deploy hook
      ansible.builtin.slurp:
        src: "{{ uptime_kuma_template_tmpdir.path }}/lego-deploy-hook.sh"
      register: uptime_kuma_hook_slurp

    - name: Read rendered backup script
      ansible.builtin.slurp:
        src: "{{ uptime_kuma_template_tmpdir.path }}/uptime-kuma-backup.sh"
      register: uptime_kuma_backup_script_slurp

    - name: Read rendered backup service
      ansible.builtin.slurp:
        src: "{{ uptime_kuma_template_tmpdir.path }}/uptime-kuma-backup.service"
      register: uptime_kuma_backup_service_slurp

    - name: Read rendered backup timer
      ansible.builtin.slurp:
        src: "{{ uptime_kuma_template_tmpdir.path }}/uptime-kuma-backup.timer"
      register: uptime_kuma_backup_timer_slurp

    - name: Set rendered template facts
      ansible.builtin.set_fact:
        uptime_kuma_service_rendered: "{{ uptime_kuma_service_slurp.content | b64decode }}"
        uptime_kuma_nginx_rendered: "{{ uptime_kuma_nginx_slurp.content | b64decode }}"
        uptime_kuma_hook_rendered: "{{ uptime_kuma_hook_slurp.content | b64decode }}"
        uptime_kuma_backup_script_rendered: "{{ uptime_kuma_backup_script_slurp.content | b64decode }}"
        uptime_kuma_backup_service_rendered: "{{ uptime_kuma_backup_service_slurp.content | b64decode }}"
        uptime_kuma_backup_timer_rendered: "{{ uptime_kuma_backup_timer_slurp.content | b64decode }}"

    - name: Validate hook shell syntax
      ansible.builtin.command:
        cmd: sh -n {{ uptime_kuma_template_tmpdir.path }}/lego-deploy-hook.sh
      changed_when: false

    - name: Validate backup script shell syntax
      ansible.builtin.command:
        cmd: sh -n {{ uptime_kuma_template_tmpdir.path }}/uptime-kuma-backup.sh
      changed_when: false

    - name: Assert systemd service properties
      ansible.builtin.assert:
        that:
          - uptime_kuma_service_rendered is search('User=kuma')
          - uptime_kuma_service_rendered is search('Group=kuma')
          - uptime_kuma_service_rendered is search('UPTIME_KUMA_HOST=127\.0\.0\.1')
          - uptime_kuma_service_rendered is search('UPTIME_KUMA_PORT=3001')
          - uptime_kuma_service_rendered is search('DATA_DIR=/var/lib/uptime-kuma')
          - uptime_kuma_service_rendered is search('ExecStart=/usr/bin/node server/server\.js')

    - name: Assert Nginx reverse-proxy properties
      ansible.builtin.assert:
        that:
          - uptime_kuma_nginx_rendered is search('listen 443 ssl')
          - uptime_kuma_nginx_rendered is not search('listen 80')
          - uptime_kuma_nginx_rendered is search('server_name kuma\.lab\.canhdinh\.com')
          - uptime_kuma_nginx_rendered is search('proxy_pass http://127\.0\.0\.1:3001')
          - uptime_kuma_nginx_rendered is search('proxy_set_header Upgrade')
          - uptime_kuma_nginx_rendered is search('proxy_set_header Connection')

    - name: Assert certificate hook safety properties
      ansible.builtin.assert:
        that:
          - uptime_kuma_hook_rendered is search('/var/lib/lego/certificates/kuma\.crt')
          - uptime_kuma_hook_rendered is search('openssl x509')
          - uptime_kuma_hook_rendered is search('openssl pkey')
          - uptime_kuma_hook_rendered is search('nginx -t')
          - uptime_kuma_hook_rendered is search('systemctl reload nginx\.service')

    - name: Assert backup script properties
      ansible.builtin.assert:
        that:
          - uptime_kuma_backup_script_rendered is search('sqlite3.*\\.backup')
          - uptime_kuma_backup_script_rendered is search('PRAGMA quick_check')
          - uptime_kuma_backup_script_rendered is search('gzip')
          - uptime_kuma_backup_script_rendered is search('awk -v keep=')
          - uptime_kuma_backup_service_rendered is search('Type=oneshot')
          - uptime_kuma_backup_timer_rendered is search('OnCalendar=daily')
          - uptime_kuma_backup_timer_rendered is search('Persistent=true')
          - uptime_kuma_backup_timer_rendered is search('RandomizedDelaySec=1h')

    - name: Read runtime tasks file
      ansible.builtin.slurp:
        src: "{{ (playbook_dir | dirname) ~ '/tasks/runtime.yaml' }}"
      register: uptime_kuma_runtime_tasks_slurp

    - name: Set runtime tasks fact
      ansible.builtin.set_fact:
        uptime_kuma_runtime_tasks: "{{ uptime_kuma_runtime_tasks_slurp.content | b64decode }}"

    - name: Extract runtime task order
      ansible.builtin.set_fact:
        uptime_kuma_daemon_reload_position: "{{ uptime_kuma_runtime_tasks.find('name: Reload systemd daemon') }}"
        uptime_kuma_nginx_validate_position: "{{ uptime_kuma_runtime_tasks.find('name: Validate Nginx configuration') }}"
        uptime_kuma_enable_kuma_position: "{{ uptime_kuma_runtime_tasks.find('name: Enable and start Uptime Kuma') }}"
        uptime_kuma_enable_nginx_position: "{{ uptime_kuma_runtime_tasks.find('name: Enable and start Nginx') }}"
        uptime_kuma_flush_position: "{{ uptime_kuma_runtime_tasks.find('name: Flush runtime handlers') }}"
        uptime_kuma_wait_kuma_position: "{{ uptime_kuma_runtime_tasks.find('name: Wait for private Uptime Kuma listener') }}"
        uptime_kuma_wait_nginx_position: "{{ uptime_kuma_runtime_tasks.find('name: Wait for Nginx HTTPS listener') }}"
        uptime_kuma_find_releases_position: "{{ uptime_kuma_runtime_tasks.find('name: Find installed Uptime Kuma releases') }}"

    - name: Assert runtime task lifecycle order
      ansible.builtin.assert:
        that:
          - uptime_kuma_daemon_reload_position | int > 0
          - uptime_kuma_nginx_validate_position | int > 0
          - uptime_kuma_enable_kuma_position | int > 0
          - uptime_kuma_enable_nginx_position | int > 0
          - uptime_kuma_flush_position | int > 0
          - uptime_kuma_wait_kuma_position | int > 0
          - uptime_kuma_wait_nginx_position | int > 0
          - uptime_kuma_find_releases_position | int > 0
          - uptime_kuma_daemon_reload_position | int < uptime_kuma_enable_kuma_position | int
          - uptime_kuma_nginx_validate_position | int < uptime_kuma_enable_nginx_position | int
          - uptime_kuma_enable_kuma_position | int < uptime_kuma_flush_position | int
          - uptime_kuma_enable_nginx_position | int < uptime_kuma_flush_position | int
          - uptime_kuma_flush_position | int < uptime_kuma_wait_kuma_position | int
          - uptime_kuma_wait_kuma_position | int < uptime_kuma_find_releases_position | int
          - uptime_kuma_wait_nginx_position | int < uptime_kuma_find_releases_position | int
        fail_msg: Runtime task lifecycle order incorrect

    - name: Clean up temporary template directory
      ansible.builtin.file:
        path: "{{ uptime_kuma_template_tmpdir.path }}"
        state: absent

    - name: Read live verification playbook
      ansible.builtin.slurp:
        src: "{{ (playbook_dir | dirname | dirname | dirname) ~ '/verify-kuma.yaml' }}"
      register: uptime_kuma_verify_playbook

    - name: Define listener fixtures
      ansible.builtin.set_fact:
        uptime_kuma_ss_valid: |
          LISTEN 0 511 0.0.0.0:443 0.0.0.0:* users:(("nginx",pid=100,fd=5))
          LISTEN 0 511 127.0.0.1:3001 0.0.0.0:* users:(("node",pid=200,fd=20))
        uptime_kuma_ss_invalid_ipv4: |
          LISTEN 0 511 0.0.0.0:3001 0.0.0.0:* users:(("node",pid=200,fd=20))
        uptime_kuma_ss_invalid_ipv6: |
          LISTEN 0 511 [::]:3001 [::]:* users:(("node",pid=200,fd=20))

    - name: Assert listener boundary predicates
      ansible.builtin.assert:
        that:
          - uptime_kuma_ss_valid is regex('(?m)^.*127\\.0\\.0\\.1:3001\\b.*node')
          - uptime_kuma_ss_valid is regex('(?m)^.*:443\\b.*nginx')
          - uptime_kuma_ss_valid is not regex('(?m)^.*(?:0\\.0\\.0\\.0|\\*|\\[::\\]):3001\\b')
          - uptime_kuma_ss_invalid_ipv4 is regex('(?m)^.*(?:0\\.0\\.0\\.0|\\*|\\[::\\]):3001\\b')
          - uptime_kuma_ss_invalid_ipv6 is regex('(?m)^.*(?:0\\.0\\.0\\.0|\\*|\\[::\\]):3001\\b')
