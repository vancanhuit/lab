---
- name: Reset protected-path fixture result
  ansible.builtin.set_fact:
    uptime_kuma_path_accepted: true

- name: Run production protected-path assertions
  block:
    - name: Verify protected-path fixture
      ansible.builtin.include_tasks: ../tasks/verify-paths.yaml
      vars:
        uptime_kuma_protected_paths:
          results: ["{{ uptime_kuma_path_case.result }}"]
  rescue:
    - name: Require a protected-path assertion failure
      ansible.builtin.assert:
        that:
          - ansible_failed_result.results[0].assertion is defined
          - ansible_failed_result.results[0].msg is search('does not exist at|has incorrect permissions')

    - name: Record rejected protected-path fixture
      ansible.builtin.set_fact:
        uptime_kuma_path_accepted: false

- name: Assert protected-path fixture outcome
  ansible.builtin.assert:
    that:
      - uptime_kuma_path_accepted == uptime_kuma_path_case.expected
