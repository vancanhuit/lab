---
- name: Assert protected paths exist
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: "{{ item.item.label }} does not exist at {{ item.item.path }}"
    success_msg: "{{ item.item.label }} exists"
  loop: "{{ uptime_kuma_protected_paths.results }}"
  loop_control:
    label: "{{ item.item.path }}"

- name: Assert protected path ownership and modes
  ansible.builtin.assert:
    that:
      - item.item.owner is none or item.stat.pw_name == item.item.owner
      - item.item.group is none or item.stat.gr_name == item.item.group
      - item.stat.mode == item.item.mode
    fail_msg: >-
      {{ item.item.label }} at {{ item.item.path }} has incorrect permissions:
      owner={{ item.stat.pw_name }} (expected {{ item.item.owner | default('any') }}),
      group={{ item.stat.gr_name }} (expected {{ item.item.group | default('any') }}),
      mode={{ item.stat.mode }} (expected {{ item.item.mode }})
    success_msg: "{{ item.item.label }} permissions correct"
  loop: "{{ uptime_kuma_protected_paths.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  when: item.stat.exists
