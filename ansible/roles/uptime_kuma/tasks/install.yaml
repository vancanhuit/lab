---
- name: Install Uptime Kuma operating-system dependencies
  ansible.builtin.apt:
    name:
      - acl
      - build-essential
      - ca-certificates
      - curl
      - git
      - gnupg
      - nginx
      - openssl
      - python3
      - python3-debian
      - sqlite3
      - ssl-cert
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create APT keyring directory
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Download NodeSource repository key
  ansible.builtin.get_url:
    url: "{{ uptime_kuma_nodesource_key_url }}"
    dest: /usr/share/keyrings/nodesource-repo.gpg.key
    owner: root
    group: root
    mode: '0644'

- name: Read NodeSource repository key fingerprint
  ansible.builtin.command:
    cmd: gpg --batch --show-keys --with-colons /usr/share/keyrings/nodesource-repo.gpg.key
  register: uptime_kuma_nodesource_key_check
  changed_when: false
  failed_when: >-
    'fpr:::::::::' ~ uptime_kuma_nodesource_key_fingerprint ~ ':'
    not in uptime_kuma_nodesource_key_check.stdout

- name: Remove legacy NodeSource repository definition
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/nodesource.list
    state: absent
  register: uptime_kuma_legacy_nodesource_repository

- name: Configure NodeSource Node.js repository
  ansible.builtin.deb822_repository:
    name: nodesource
    types:
      - deb
    uris:
      - "https://deb.nodesource.com/node_{{ uptime_kuma_node_major }}.x"
    suites:
      - nodistro
    components:
      - main
    architectures:
      - "{{ ansible_facts.architecture | regex_replace('^x86_64$', 'amd64') | regex_replace('^aarch64$', 'arm64') }}"
    signed_by: /usr/share/keyrings/nodesource-repo.gpg.key
    mode: '0644'
    state: present
  register: uptime_kuma_nodesource_repository

- name: Update APT cache after NodeSource repository changes
  ansible.builtin.apt:
    update_cache: true
  when: >-
    uptime_kuma_legacy_nodesource_repository.changed or
    uptime_kuma_nodesource_repository.changed

- name: Install Node.js 24 LTS # noqa: package-latest
  ansible.builtin.apt:
    name: nodejs
    state: latest
  notify: Restart Uptime Kuma

- name: Check installed Node.js version
  ansible.builtin.command:
    cmd: node --version
  register: uptime_kuma_node_version_check
  changed_when: false
  failed_when: uptime_kuma_node_version_check.stdout is not match('^v24\.')

- name: Create Uptime Kuma system group
  ansible.builtin.group:
    name: "{{ uptime_kuma_group }}"
    system: true
    state: present

- name: Create Uptime Kuma system user
  ansible.builtin.user:
    name: "{{ uptime_kuma_user }}"
    group: "{{ uptime_kuma_group }}"
    home: "{{ uptime_kuma_data_directory }}"
    shell: /usr/sbin/nologin
    system: true
    create_home: false
    state: present

- name: Create Uptime Kuma managed directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ uptime_kuma_install_root }}", owner: root, group: root, mode: '0755' }
    - { path: "{{ uptime_kuma_install_root }}/releases", owner: root, group: root, mode: '0755' }
    - { path: "{{ uptime_kuma_data_directory }}", owner: "{{ uptime_kuma_user }}", group: "{{ uptime_kuma_group }}", mode: '0700' }
    - { path: "{{ uptime_kuma_npm_cache_directory }}", owner: "{{ uptime_kuma_user }}", group: "{{ uptime_kuma_group }}", mode: '0700' }

- name: Create pinned release directory
  ansible.builtin.file:
    path: "{{ uptime_kuma_release_path }}"
    state: directory
    owner: "{{ uptime_kuma_user }}"
    group: "{{ uptime_kuma_group }}"
    mode: '0755'
