---
- name: Validate SeaweedFS role contract
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    seaweedfs_domain: s3.lab.canhdinh.com
    seaweedfs_s3_access_key: test-access-key-1234
    seaweedfs_s3_secret_key: test-secret-key-that-is-at-least-32-characters
    seaweedfs_gitea_access_key: test-gitea-access-key
    seaweedfs_gitea_secret_key: test-gitea-secret-key
    seaweedfs_gitea_bucket: homelab-gitea
    seaweedfs_harbor_access_key: test-harbor-access-key
    seaweedfs_harbor_secret_key: test-harbor-secret-key
    seaweedfs_harbor_bucket: homelab-harbor
    ansible_facts:
      distribution: Debian
      distribution_major_version: '13'
      architecture: x86_64
  tasks:
    - name: Load SeaweedFS role defaults
      ansible.builtin.include_vars:
        file: "{{ (playbook_dir | dirname) ~ '/defaults/main.yaml' }}"

    - name: Run role validation
      ansible.builtin.import_tasks: "{{ (playbook_dir | dirname) ~ '/tasks/validate.yaml' }}"

    - name: Create template output directory
      ansible.builtin.tempfile:
        state: directory
      register: seaweedfs_test_dir

    - name: Select an existing mount for the positive fixture
      ansible.builtin.set_fact:
        seaweedfs_data_directory: /

    - name: Accept an existing mount using the production guard
      ansible.builtin.import_tasks: "{{ (playbook_dir | dirname) ~ '/tasks/verify-mount.yaml' }}"

    - name: Select an ordinary directory for the negative fixture
      ansible.builtin.set_fact:
        seaweedfs_data_directory: "{{ seaweedfs_test_dir.path }}"

    - name: Reject an ordinary directory using the production guard
      block:
        - name: Check the unmounted directory
          ansible.builtin.include_tasks: "{{ (playbook_dir | dirname) ~ '/tasks/verify-mount.yaml' }}"

        - name: Fail if the mount guard accepted an ordinary directory
          ansible.builtin.fail:
            msg: Mount guard accepted an unmounted data directory
      rescue:
        - name: Require a mountpoint rejection
          ansible.builtin.assert:
            that:
              - ansible_failed_result.rc | default(-1) == 32

    - name: Restore the deployment data directory
      ansible.builtin.set_fact:
        seaweedfs_data_directory: /var/lib/seaweedfs

    - name: Assert the mount guard precedes deployment changes and runs in check mode
      ansible.builtin.assert:
        that:
          - seaweedfs_tasks[1]['ansible.builtin.import_tasks'] == 'verify-mount.yaml'
          - not seaweedfs_mount_tasks[0].check_mode
          - not seaweedfs_mount_tasks[0].changed_when
      vars:
        seaweedfs_tasks: "{{ lookup('ansible.builtin.file', (playbook_dir | dirname) ~ '/tasks/main.yaml') | from_yaml }}"
        seaweedfs_mount_tasks: "{{ lookup('ansible.builtin.file', (playbook_dir | dirname) ~ '/tasks/verify-mount.yaml') | from_yaml }}"

    - name: Render SeaweedFS templates
      ansible.builtin.template:
        src: "{{ (playbook_dir | dirname) ~ '/templates/' ~ item }}"
        dest: "{{ seaweedfs_test_dir.path }}/{{ item }}"
        mode: '0600'
      loop:
        - s3.json.j2
        - seaweedfs.service.j2
        - nginx.conf.j2
        - lego-deploy-hook.sh.j2

    - name: Read rendered templates
      ansible.builtin.slurp:
        src: "{{ seaweedfs_test_dir.path }}/{{ item }}"
      loop:
        - s3.json.j2
        - seaweedfs.service.j2
        - nginx.conf.j2
        - lego-deploy-hook.sh.j2
      register: seaweedfs_rendered_files

    - name: Set rendered template facts
      ansible.builtin.set_fact:
        seaweedfs_s3_config: "{{ seaweedfs_rendered_files.results[0].content | b64decode }}"
        seaweedfs_service: "{{ seaweedfs_rendered_files.results[1].content | b64decode }}"
        seaweedfs_nginx: "{{ seaweedfs_rendered_files.results[2].content | b64decode }}"
        seaweedfs_hook: "{{ seaweedfs_rendered_files.results[3].content | b64decode }}"

    - name: Assert SeaweedFS configuration invariants
      ansible.builtin.assert:
        that:
          - (seaweedfs_s3_config | from_json).identities[0].actions == ['Admin', 'Read', 'List', 'Tagging', 'Write']
          - >-
            (seaweedfs_s3_config | from_json).identities[1].actions ==
            ['Read:homelab-gitea', 'List:homelab-gitea', 'Tagging:homelab-gitea', 'Write:homelab-gitea']
          - >-
            (seaweedfs_s3_config | from_json).identities[2].actions ==
            ['Read:homelab-harbor', 'List:homelab-harbor', 'Tagging:homelab-harbor', 'Write:homelab-harbor']
          - seaweedfs_service is search('-ip.bind=127\.0\.0\.1')
          - seaweedfs_service is search('-s3.ip.bind=127\.0\.0\.1')
          - seaweedfs_service is search('-s3.port=8333')
          - seaweedfs_service is search('-s3.externalUrl=https://s3\.lab\.canhdinh\.com')
          - seaweedfs_service is search('ReadWritePaths=/var/lib/seaweedfs')
          - "'RequiresMountsFor=/var/lib/seaweedfs' in seaweedfs_service.splitlines()"
          - "'AssertPathIsMountPoint=/var/lib/seaweedfs' in seaweedfs_service.splitlines()"
          - seaweedfs_nginx is search('listen 443 ssl')
          - seaweedfs_nginx is search('proxy_pass http://127\.0\.0\.1:8333')
          - seaweedfs_nginx is search('proxy_request_buffering off')
          - seaweedfs_hook is search('openssl x509')
          - seaweedfs_hook is search('systemctl reload nginx\.service')

    - name: Validate certificate hook shell syntax
      ansible.builtin.command:
        cmd: "sh -n {{ seaweedfs_test_dir.path }}/lego-deploy-hook.sh.j2"
      changed_when: false

    - name: Load production bucket creation task
      ansible.builtin.set_fact:
        seaweedfs_bucket_task: >-
          {{ lookup('ansible.builtin.file', (playbook_dir | dirname) ~ '/tasks/main.yaml') |
             from_yaml | selectattr('name', 'equalto', 'Create application S3 buckets') | first }}

    - name: Prepare local bucket provisioning test
      ansible.builtin.copy:
        dest: "{{ seaweedfs_test_dir.path }}/buckets.yml"
        mode: '0600'
        content: >-
          {{ [seaweedfs_bucket_task | combine({
                'ansible.builtin.command': seaweedfs_bucket_task['ansible.builtin.command'] | combine({'cmd': '/bin/cat'}),
                'register': 'seaweedfs_test_bucket_creation'
              })] | to_nice_yaml }}

    - name: Test bucket provisioning for fresh and existing storage
      ansible.builtin.include_tasks: bucket-case.yml
      loop:
        - { listed: [], created: [homelab-gitea, homelab-harbor] }
        - { listed: ['homelab-harbor owner:harbor'], created: [homelab-gitea] }
        - { listed: ['homelab-gitea owner:gitea'], created: [homelab-harbor] }
        - { listed: ['  homelab-gitea owner:gitea', 'homelab-harbor owner:harbor'], created: [] }
        - { listed: ['homelab-gitea', 'homelab-harbor'], created: [] }
        - { listed: ['homelab-gitea-old owner:gitea'], created: [homelab-gitea, homelab-harbor] }
      loop_control:
        loop_var: seaweedfs_bucket_case

    - name: Assert production bucket command
      ansible.builtin.assert:
        that:
          - seaweedfs_bucket_task['ansible.builtin.command'].cmd == '/usr/local/bin/weed shell'

    - name: Remove template output directory
      ansible.builtin.file:
        path: "{{ seaweedfs_test_dir.path }}"
        state: absent
