---
- name: Validate SeaweedFS deployment inputs
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Debian'
      - ansible_facts.distribution_major_version == '13'
      - ansible_facts.architecture == 'x86_64'
      - seaweedfs_domain is match('^[a-z0-9.-]+$')
      - seaweedfs_s3_access_key | length >= 16
      - seaweedfs_s3_secret_key | length >= 32
      - seaweedfs_s3_port | int == 443
    fail_msg: SeaweedFS requires Debian 13 amd64, valid credentials, and HTTPS on port 443
  no_log: true
