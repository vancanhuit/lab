---
- name: Reload Gateway firewall
  ansible.builtin.systemd_service:
    name: kubernetes-gateway-firewall.service
    state: reloaded
    daemon_reload: true

- name: Restart containerd
  ansible.builtin.systemd_service:
    name: containerd
    state: restarted
    daemon_reload: true

- name: Restart kubelet
  ansible.builtin.systemd_service:
    name: kubelet
    state: restarted
    daemon_reload: true
