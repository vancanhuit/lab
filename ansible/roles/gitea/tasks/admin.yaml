---
# Gitea 1.27 `admin user list --admin` output format:
# Header: "ID Username Email IsActive"
# Rows: numeric_id <whitespace> username <whitespace> email <whitespace> boolean
- name: List Gitea administrators
  ansible.builtin.command:
    argv:
      - "{{ gitea_binary_path }}"
      - admin
      - user
      - list
      - --admin
      - --config
      - "{{ gitea_config_path }}"
  become: true
  become_user: "{{ gitea_user }}"
  environment:
    USER: "{{ gitea_user }}"
    HOME: "{{ gitea_home }}"
    GITEA_WORK_DIR: "{{ gitea_work_directory }}"
  register: gitea_admin_list
  changed_when: false

- name: Inspect Gitea administrator state
  ansible.builtin.import_tasks: admin-state.yaml

- name: Create initial Gitea administrator
  ansible.builtin.command:
    argv:
      - "{{ gitea_binary_path }}"
      - admin
      - user
      - create
      - --username
      - "{{ gitea_admin_username }}"
      - --password
      - "{{ gitea_admin_password }}"
      - --email
      - "{{ gitea_admin_email }}"
      - --admin
      - --must-change-password=true
      - --config
      - "{{ gitea_config_path }}"
  become: true
  become_user: "{{ gitea_user }}"
  environment:
    USER: "{{ gitea_user }}"
    HOME: "{{ gitea_home }}"
    GITEA_WORK_DIR: "{{ gitea_work_directory }}"
  when: not gitea_admin_exists
  changed_when: true
  no_log: true
